<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Control Adeept AWD robot car" />
    <title>RoboConsole</title>
    <link
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.colors.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link href="/css/app.css" rel="stylesheet" />
  </head>
  <body lang="en" data-theme="light">
    <div id="app"></div>
    <script>
      // Decide if we are loading dev assets or production bundle
      const dev = location.port === "3000" || location.port === "3001";
      const script = document.createElement("script");
      script.src = dev ? "js/dev/main.js" : "js/release/main.js";
      document.body.appendChild(script);
    </script>
  </body>
</html>
